jobs:
  publish-alpha:
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        registry-url: https://registry.npmjs.org/
    - name: Install dependencies
      run: npm ci
    - name: Build package
      run: npm run build
    - continue-on-error: true
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      name: Publish to npm (alpha)
      run: npm publish --tag alpha
  publish-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        registry-url: https://registry.npmjs.org/
    - name: Install dependencies
      run: npm ci
    - name: Build package
      run: npm run build
    - env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      name: Publish to npm (latest)
      run: npm publish
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        cache: npm
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      run: npm ci
    - continue-on-error: true
      name: Run linter
      run: npm run lint
    - name: Type check
      run: npx tsc --noEmit
    - name: Run tests
      run: npm test
    - name: Build package
      run: npm run build
    strategy:
      matrix:
        node-version:
        - 16.x
        - 18.x
        - 20.x
name: Test and Build
on:
  pull_request:
    branches:
    - main
    - development
  push:
    branches:
    - main
    - development
